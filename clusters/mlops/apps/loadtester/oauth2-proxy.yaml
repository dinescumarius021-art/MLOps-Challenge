apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: loadtester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        args:
        - --provider=keycloak-oidc
        - --client-id=loadtester
        - --client-secret-file=/etc/secrets/client-secret
        - --oidc-issuer-url=http://keycloak.keycloak.svc.cluster.local:8080/realms/mlops
        - --http-address=0.0.0.0:4180
        - --email-domain=*
        - --cookie-secret=12345678901234567890123456789012
        - --cookie-secure=false
        - --upstream=file:///dev/null
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
      volumes:
      - name: secret-volume
        secret:
          secretName: keycloak-client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: loadtester
spec:
  ports:
  - port: 4180
    targetPort: 4180
    name: http
  selector:
    app: oauth2-proxy