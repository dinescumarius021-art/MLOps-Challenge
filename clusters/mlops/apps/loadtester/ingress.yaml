apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loadtester-ingress
  namespace: loadtester
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.loadtester.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "http://localhost:8081/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "24k"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: loadtester
            port:
              number: 8081